<div id="done-status"{% if not checked %} hx-get="/onboarding/done/status" hx-trigger="every 3s" hx-swap="outerHTML"{% endif %}>
  {% if checked %}<p>Checked {{ "{:,}".format(checked) }} jobs; <b>{{ "{:,}".format(matching) }}</b> match your filters.</p>
  <p class="muted">Your first scores arrive with the next run.</p>
  {% else %}<p class="muted">Checking jobs…</p>{% endif %}
</div>
