name: Asha Owner
email: owner@example.com
linkedin: https://www.linkedin.com/in/asha-owner/
github: ""
experience_summary: ~1.3 years as a Product Analyst plus a 3-month consulting internship. B.Tech EE (2025).
target_roles:
  - Senior Product Analyst
  - Product Analyst
  - Associate Product Manager
  - Product Manager
  - AI Product Manager
  - Founder's Office
  - Analytics roles with a product focus
cities: [Bengaluru, Gurgaon, Noida, Pune]
remote_india_ok: true
current_ctc_lpa: 20
target_base_lpa: 25
must_haves: []
deal_breakers: []
title_deny: [sales, sde, software engineer, intern, internship, director, head of, vp, vice president, account executive, recruiter,
  designer, design lead, engineer, engineering, developer, architect, product marketing]
# a title must contain at least one of these (cheap gate before any LLM call)
title_allow: [product, analyst, analytics, founder, chief of staff, growth, strategy, insights, business intelligence]
drop_if_min_years_at_least: 2.5  # drop jobs whose stated minimum experience is 2.5+ years
max_age_days: 7
thresholds: {apply: 70, review: 50}
budgets: {score_per_run: 80, draft_per_run: 10}
models: {scoring: openai/gpt-oss-20b, drafting: openai/gpt-oss-120b, facts: openai/gpt-oss-120b}
min_prescore: 30
# Job-site searches (LinkedIn once per query across India; Naukri/Indeed per query x location)
search:
  queries: [Product Analyst, Associate Product Manager, Product Manager, Founder's Office, Growth Analyst]
  locations: [Bengaluru, Gurgaon, Noida, Pune]
  remote_query: true
  hours_old: 72
  results_per_search: 25
  sites: [linkedin, naukri, indeed]
  linkedin_descriptions_per_run: 15
