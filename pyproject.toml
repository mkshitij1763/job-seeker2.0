[project]
name = "jobseeker"
version = "0.1.0"
description = "Personal job search and outreach assistant"
readme = "README.md"
authors = [
    { name = "Kshitij Meshram", email = "horizon.1763@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-jobspy==1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
jobseeker = "jobseeker.cli:app"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-socket>=0.8.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket -q"
