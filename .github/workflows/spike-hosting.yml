# THROWAWAY: hosting feasibility spike. No secrets used. Branch spike/hosting only.
name: spike-hosting
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python spike/probe.py
